<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TeenRec</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header style="background:#4CAF50; color:white; padding:15px; text-align:center;">
        <h1>TeenRec</h1>
        <nav>
            <a href="{% url 'home:index' %}" style="margin:0 10px; color:white;">Home</a>
            <a href="{% url 'activities:list' %}" style="margin:0 10px; color:white;">Activities</a>
            <a href="{% url 'recommendations:list' %}" style="margin:0 10px; color:white;">Recommendations</a>
            <a href="{% url 'subscriptions:view' %}" style="margin:0 10px; color:white;">Subscription</a>
            {% if user.is_authenticated %}
                <a href="{% url 'users:logout' %}" style="margin:0 10px; color:white;">Logout</a>
            {% else %}
                <a href="{% url 'users:login' %}" style="margin:0 10px; color:white;">Login</a>
                <a href="{% url 'users:signup' %}" style="margin:0 10px; color:white;">Sign Up</a>
            {% endif %}
        </nav>
    </header>

    <main style="padding:20px;">
        {% block content %}
        {% endblock %}
    </main>

    <footer style="background:#f1f1f1; text-align:center; padding:10px; margin-top:20px;">
        <p>&copy; 2026 TeenRec. All rights reserved.</p>
    </footer>
</body>
</html>
